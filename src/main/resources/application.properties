spring.application.name=vaadinerp
server.port=8080

# spring.datasource.url=jdbc:postgresql://172.16.0.96:5432/grp?currentSchema=public,dynamic&stringtype=unspecified
# spring.datasource.username=gaadmin
# spring.datasource.password=Growth90!@#$
spring.datasource.url=jdbc:postgresql://localhost:5432/grp?currentSchema=public,dynamic&stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# --- Konfigurasi Logging Aplikasi & SQL Debugging ---
logging.level.root=INFO
logging.level.com.vaadinerp=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# --- Konfigurasi HikariCP Connection Pool (Anti Connection-Closed & Auto-Keepalive) ---
spring.datasource.hikari.pool-name=VaadinErpHikariPool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
# Waktu maksimal menunggu koneksi tersedia dari pool (30 detik)
spring.datasource.hikari.connection-timeout=30000
# Waktu maksimal koneksi boleh diam (idle) di dalam pool sebelum ditutup (10 menit)
spring.datasource.hikari.idle-timeout=600000
# Waktu hidup maksimal koneksi sebelum didaur ulang oleh Hikari (28 menit, mencegah diputus sepihak oleh firewall/Postgres yang rata-rata 30 menit)
spring.datasource.hikari.max-lifetime=1680000
# PENTING: Aktifkan Keepalive agar koneksi secara berkala diping/dites saat malam hari / idle (setiap 3 menit)
spring.datasource.hikari.keepalive-time=180000
# Auto-validasi sebelum koneksi diberikan ke aplikasi (5 detik)
spring.datasource.hikari.validation-timeout=5000

# Production-safe: 'validate' hanya memvalidasi skema tanpa mengubahnya.
# Untuk development, gunakan profil dev: java -jar app.jar --spring.profiles.active=dev
# atau buat file application-dev.properties dengan spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.vaadinerp
vaadin.react.enable=false
vaadin.sendUrls=false
vaadin.devmode.stats.enable=false

# --- Konfigurasi Session & Timeout Keamanan ---
# Batas waktu tidak aktif (idle) sebelum sesi HTTP kedaluwarsa (30 menit)
server.servlet.session.timeout=30m
app.auth.remember-me.token-validity-seconds=604800

# JSP View Resolution
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
# PENTING: Paksa Vaadin menutup sesi yang idle & mengabaikan ping heartbeat browser
vaadin.closeIdleSessions=true
# Interval pengecekan koneksi browser ke server (detik)
vaadin.heartbeatInterval=180

# --- Konfigurasi File Upload ---
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Nonaktifkan audit untuk pru   roses INSERT
app.audit.insert.enabled=false
# Nonaktifkan audit untuk proses UPDATE
app.audit.update.enabled=false
# (Opsional) Jika ingin mematikan SELURUH audit (Insert/Update/Delete sekaligus)
app.seed-data.enabled=false

# --- Konfigurasi Spring Boot Actuator Logfile (Web Log Streaming) ---
# Tentukan lokasi file log fisik yang akan dibaca Actuator
#logging.file.name=server.log
# Buka akses endpoint logfile via web HTTP
#management.endpoints.web.exposure.include=health,info,logfile
# 1. Beri tahu Spring Boot lokasi file log fisik yang ingin stream ke web
logging.file.name=/opt/grp/logs/server.log

# 2. Buka gembok endpoint Actuator logfile via HTTP
management.endpoints.web.exposure.include=health,info,logfile

# 3. PENTING: Pengecualian URL agar tidak ditangkap & dilempar ke Login oleh router Vaadin
vaadin.excludeUrls=/actuator/**,/stimulsoft-java/**,/stimulsoft_webdesigner_action,/stimulsoft_webdesigner_action/**,/stimulsoft_webviewer_action,/stimulsoft_webviewer_action/**,/stimulsoft_web_resource,/stimulsoft_web_resource/**

# --- Keamanan Actuator (HTTP Basic Auth Popup) ---
# Kredensial untuk melihat /actuator/logfile melalui browser
actuator.security.username=adminlog
actuator.security.password=LogSecret2026!

