# Server produksi (Linux) hanya punya font DejaVu; template yang memakai fontName="Arial" membuat Jasper
# berhenti dengan 'Font "Arial" is not available to the JVM'. Dengan properti ini font yang tidak ada
# diganti font bawaan (di server: DejaVu Sans) dan report tetap tercetak. Berlaku global, hanya bila font
# memang tidak ditemukan; report yang fontnya ada (mis. di Windows) tidak berubah.
# Tampilan di server bisa sedikit berbeda dari preview Jaspersoft Studio (DejaVu lebih lebar dari Arial).
net.sf.jasperreports.awt.ignore.missing.font=true
